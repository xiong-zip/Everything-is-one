server:
  port: ${AGENTFLOW_PORT:8888}

spring:
  application:
    name: agentflow
  servlet:
    multipart:
      # 个人知识库上传：单文件/整请求上限
      max-file-size: ${AGENTFLOW_KB_MAX_FILE_MB:20MB}
      max-request-size: 30MB

agentflow:
  # 执行模式：plan=先整体规划再顺序/并行执行（默认）；react=ReAct 自主循环，逐轮决策下一步动作；
  # hybrid=混合模式，先按计划执行，工具步未命中/失败时放弃剩余计划、转 ReAct 自主找路（需 LLM）
  agent:
    mode: ${AGENTFLOW_AGENT_MODE:plan}
  llm:
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-v4-flash
    proxy:
      host: ${LLM_PROXY_HOST:}
      port: ${LLM_PROXY_PORT:0}
  gitlab:
    base-url: ${GITLAB_URL:http://gitlab.zoesoft.com.cn}
    token: ${GITLAB_TOKEN:}
  storage:
    # 任务历史数据库文件路径（SQLite），目录不存在会自动创建
    path: ${AGENTFLOW_DB:./data/agentflow.db}
    # 历史保留策略：超过 N 天的运行记录在启动时清理（0 = 不清理）
    retention-days: ${AGENTFLOW_RETENTION_DAYS:30}
    # 历史条数上限：只保留最新的 N 条（0 = 不限制）
    max-runs: ${AGENTFLOW_MAX_RUNS:1000}
  report:
    # GitLab 工作报告抬头中的部门名
    department: ${AGENTFLOW_DEPT:中台研发部}
  notify:
    # 通用 Webhook（企微/钉钉机器人），晨报生成后推送；留空则只落库不推送
    webhook: ${AGENTFLOW_NOTIFY_WEBHOOK:}
  db:
    # 内置 db-architect 数据库透视：Python 解释器命令与脚本目录
    python-cmd: ${AGENTFLOW_DB_PYTHON:python}
    scripts-path: ${AGENTFLOW_DB_SCRIPTS:./tools/db-architect/scripts}
  signoz:
    # SigNoz 链路分析（内置 signoz.trace / signoz.case 工具）：MCP 服务地址，留空则工具提示未配置
    mcp-url: ${SIGNOZ_MCP_URL:http://192.168.2.111:18000/mcp}
    # 链路查询默认时间窗；查不到时自动退到 fallback-range（两天前的链路只有 7d 才查得到）
    time-range: ${SIGNOZ_TIME_RANGE:24h}
    fallback-range: ${SIGNOZ_FALLBACK_RANGE:7d}
    # 失败链路补查 ERROR/WARN 日志的条数上限
    log-limit: ${SIGNOZ_LOG_LIMIT:10}
    # 故障案例知识库目录（相对路径自动锚定项目根）
    kb-path: ${AGENTFLOW_INCIDENT_KB:./docs/incidents}
    # 链路分析记录保留条数上限（工作台 → 链路分析 面板的数据，与任务历史共用同一个 SQLite）
    analysis-max: ${AGENTFLOW_ANALYSIS_MAX:2000}
  kuboard:
    # K8s 运维排查（内置 k8s.query 工具）：Kuboard 面板地址与账号，工具经其 /k8s-api 代理访问集群（只读）
    url: ${KUBOARD_URL:}
    username: ${KUBOARD_USERNAME:}
    password: ${KUBOARD_PASSWORD:}
    # 默认操作的集群名（Kuboard 中导入时的集群名，完整列表用 k8s.query action=clusters 查询）
    cluster: ${KUBOARD_CLUSTER:dev}
  correlate:
    # 变更关联（内置 gitlab.changes 工具）：默认回溯故障前 N 小时的提交（上限 168）
    window-hours: ${AGENTFLOW_CORRELATE_WINDOW_HOURS:48}
    # 单次关联的项目数上限（服务去重后）
    max-projects: 5
    # 展示的嫌疑变更条数上限
    max-commits: 10
  memory:
    # 长期记忆总开关：关闭后不注入 prompt、不做自动提取，「记住/忘记」指令也会提示未启用
    enabled: ${AGENTFLOW_MEMORY:true}
  kb:
    # 个人知识库：上传文件的落盘目录（相对路径自动锚定项目根）
    files-path: ${AGENTFLOW_KB_FILES:./data/kb-files}
    # 文件数上限（超出拒绝上传，防误传整个目录）
    max-files: ${AGENTFLOW_KB_MAX_FILES:200}
    # 分块目标字符数与相邻块重叠字符（检索粒度）
    chunk-chars: ${AGENTFLOW_KB_CHUNK_CHARS:600}
    chunk-overlap: ${AGENTFLOW_KB_CHUNK_OVERLAP:80}
    # 检索返回的命中分块数
    top-k: ${AGENTFLOW_KB_TOP_K:5}
  schedule:
    morning-report:
      # 自动晨报机器人：定时生成昨日日报并推送（需配置 GITLAB_TOKEN；推送需配置 Webhook）
      enabled: ${AGENTFLOW_MORNING_REPORT:false}
      # 工作日早上 9 点（Spring cron，本地时区）
      cron: ${AGENTFLOW_MORNING_CRON:0 0 9 * * MON-FRI}
      command: ${AGENTFLOW_MORNING_COMMAND:根据我的 GitLab 提交记录生成昨天的工作日报}

logging:
  level:
    root: info
