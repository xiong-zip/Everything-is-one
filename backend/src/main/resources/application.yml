server:
  port: 8080

spring:
  application:
    name: agentflow

agentflow:
  llm:
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-v4-flash
    proxy:
      host: ${LLM_PROXY_HOST:}
      port: ${LLM_PROXY_PORT:0}
  gitlab:
    base-url: ${GITLAB_URL:http://gitlab.zoesoft.com.cn}
    token: ${GITLAB_TOKEN:}
  storage:
    # 任务历史数据库文件路径（SQLite），目录不存在会自动创建
    path: ${AGENTFLOW_DB:./data/agentflow.db}
  report:
    # GitLab 工作报告抬头中的部门名
    department: ${AGENTFLOW_DEPT:中台研发部}

logging:
  level:
    root: info
