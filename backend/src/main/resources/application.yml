server:
  port: ${AGENTFLOW_PORT:8888}

spring:
  application:
    name: agentflow
  servlet:
    multipart:
      # 个人知识库上传：单文件/整请求上限
      max-file-size: ${AGENTFLOW_KB_MAX_FILE_MB:20MB}
      max-request-size: 30MB

agentflow:
  # 执行模式：plan=先整体规划再顺序/并行执行（默认）；react=ReAct 自主循环，逐轮决策下一步动作；
  # hybrid=混合模式，先按计划执行，工具步未命中/失败时放弃剩余计划、转 ReAct 自主找路（需 LLM）
  agent:
    mode: ${AGENTFLOW_AGENT_MODE:plan}
  engine:
    # 运行执行池：有界线程池，队列满时新任务立即失败并如实告知（不无限建线程，也不静默排队）
    core-threads: ${AGENTFLOW_ENGINE_CORE_THREADS:8}
    max-threads: ${AGENTFLOW_ENGINE_MAX_THREADS:32}
    queue-capacity: ${AGENTFLOW_ENGINE_QUEUE_CAPACITY:256}
    # SSE 连接最长存活时间（毫秒）
    emitter-timeout-ms: ${AGENTFLOW_ENGINE_EMITTER_TIMEOUT_MS:180000}
    # 内存里保留的会话数上限（超出按完成情况淘汰；未完成的任务不会被淘汰）
    max-sessions: ${AGENTFLOW_ENGINE_MAX_SESSIONS:500}
    # confirm 模式等待用户确认计划的最长时间（分钟）
    confirm-timeout-min: ${AGENTFLOW_ENGINE_CONFIRM_TIMEOUT_MIN:10}
    # ReAct 自主循环步数上限；混合模式转入 ReAct 后的额外预算单独收紧
    max-react-steps: ${AGENTFLOW_ENGINE_MAX_REACT_STEPS:8}
    max-hybrid-react-steps: ${AGENTFLOW_ENGINE_MAX_HYBRID_REACT_STEPS:4}
    # 同一并行分组内最大并发数
    max-parallel: ${AGENTFLOW_ENGINE_MAX_PARALLEL:3}
  # write 步流式增量攒够多少字符落库+推送一次：越小越像逐字打字，落库次数与之成反比
  stream-flush-chars: ${AGENTFLOW_STREAM_FLUSH_CHARS:64}
  tool:
    # 工具侧出站超时：普通工具走短超时，远程 MCP 走长超时（链路查询本身可能跑几十秒）
    connect-timeout-ms: ${AGENTFLOW_TOOL_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${AGENTFLOW_TOOL_READ_TIMEOUT_MS:10000}
    remote-read-timeout-ms: ${AGENTFLOW_TOOL_REMOTE_READ_TIMEOUT_MS:60000}
  llm:
    # 默认接入点与模型：可在工作台「模型接入」里改（存库、改完即生效），env 只作为兜底默认值
    base-url: ${LLM_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${LLM_MODEL:deepseek-v4-flash}
    # 超时：没有超时时上游网关一挂住就会永久占用引擎线程。
    # connect=建连，read=非流式整段响应；stream-idle=流式期间「多久没有新数据」判定卡死并中断。
    connect-timeout-ms: ${AGENTFLOW_LLM_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${AGENTFLOW_LLM_READ_TIMEOUT_MS:180000}
    stream-idle-timeout-ms: ${AGENTFLOW_LLM_STREAM_IDLE_TIMEOUT_MS:90000}
    # 流式响应里是否向服务端请求 token 用量（stream_options.include_usage）。
    # 默认关闭：部分兼容网关不认识该字段会直接 400；关闭时按文本长度估算并标记为估算值。
    stream-usage: ${AGENTFLOW_LLM_STREAM_USAGE:false}
    # 单价（元/百万 token），用于把 token 折算成金额；默认 0 = 不显示金额，只显示 token。
    # 不内置模型价目表：各家价格会变、网关常有折扣，写死的数字只会给出看似精确的错误结论。
    price:
      input: ${AGENTFLOW_LLM_PRICE_INPUT:0}
      output: ${AGENTFLOW_LLM_PRICE_OUTPUT:0}
    # 调用埋点保留条数上限（工作台 → 效能与成本 面板的数据）
    usage-max: ${AGENTFLOW_LLM_USAGE_MAX:20000}
    proxy:
      host: ${LLM_PROXY_HOST:}
      port: ${LLM_PROXY_PORT:0}
  gitlab:
    base-url: ${GITLAB_URL:http://gitlab.zoesoft.com.cn}
    token: ${GITLAB_TOKEN:}
  storage:
    # 任务历史数据库文件路径（SQLite），目录不存在会自动创建
    path: ${AGENTFLOW_DB:./data/agentflow.db}
    # 历史保留策略：超过 N 天的运行记录在启动时清理（0 = 不清理）
    retention-days: ${AGENTFLOW_RETENTION_DAYS:30}
    # 历史条数上限：只保留最新的 N 条（0 = 不限制）
    max-runs: ${AGENTFLOW_MAX_RUNS:1000}
  report:
    # GitLab 工作报告抬头中的部门名
    department: ${AGENTFLOW_DEPT:中台研发部}
  notify:
    # 通用 Webhook（企微/钉钉机器人），晨报/告警生成后推送；留空则只落库不推送
    webhook: ${AGENTFLOW_NOTIFY_WEBHOOK:}
    # 告警推送要 @ 的值班人：企微手机号，逗号分隔；填 @all 表示 @所有人
    # （只作用于告警，晨报等例行推送不 @ 人）
    mention: ${AGENTFLOW_NOTIFY_MENTION:}
  db:
    # 内置 db-architect 数据库透视：Python 解释器命令与脚本目录
    python-cmd: ${AGENTFLOW_DB_PYTHON:python}
    scripts-path: ${AGENTFLOW_DB_SCRIPTS:./tools/db-architect/scripts}
  signoz:
    # SigNoz 链路分析（内置 signoz.trace / signoz.case 工具）：MCP 服务地址，留空则工具提示未配置
    mcp-url: ${SIGNOZ_MCP_URL:http://192.168.2.111:18000/mcp}
    # 链路查询默认时间窗；查不到时自动退到 fallback-range（两天前的链路只有 7d 才查得到）
    time-range: ${SIGNOZ_TIME_RANGE:24h}
    fallback-range: ${SIGNOZ_FALLBACK_RANGE:7d}
    # 失败链路补查 ERROR/WARN 日志的条数上限
    log-limit: ${SIGNOZ_LOG_LIMIT:10}
    # 故障案例知识库目录（相对路径自动锚定项目根）
    kb-path: ${AGENTFLOW_INCIDENT_KB:./docs/incidents}
    # 链路分析记录保留条数上限（工作台 → 链路分析 面板的数据，与任务历史共用同一个 SQLite）
    analysis-max: ${AGENTFLOW_ANALYSIS_MAX:2000}
  kuboard:
    # K8s 运维排查（内置 k8s.query 工具）：Kuboard 面板地址与账号，工具经其 /k8s-api 代理访问集群（只读）
    url: ${KUBOARD_URL:}
    username: ${KUBOARD_USERNAME:}
    password: ${KUBOARD_PASSWORD:}
    # 默认操作的集群名（Kuboard 中导入时的集群名，完整列表用 k8s.query action=clusters 查询）
    cluster: ${KUBOARD_CLUSTER:dev}
  correlate:
    # 变更关联（内置 gitlab.changes 工具）：默认回溯故障前 N 小时的提交（上限 168）
    window-hours: ${AGENTFLOW_CORRELATE_WINDOW_HOURS:48}
    # 单次关联的项目数上限（服务去重后）
    max-projects: 5
    # 展示的嫌疑变更条数上限
    max-commits: 10
  memory:
    # 长期记忆总开关：关闭后不注入 prompt、不做自动提取，「记住/忘记」指令也会提示未启用
    enabled: ${AGENTFLOW_MEMORY:true}
  kb:
    # 个人知识库：上传文件的落盘目录（相对路径自动锚定项目根）
    files-path: ${AGENTFLOW_KB_FILES:./data/kb-files}
    # 文件数上限（超出拒绝上传，防误传整个目录）
    max-files: ${AGENTFLOW_KB_MAX_FILES:200}
    # 分块目标字符数与相邻块重叠字符（检索粒度）
    chunk-chars: ${AGENTFLOW_KB_CHUNK_CHARS:600}
    chunk-overlap: ${AGENTFLOW_KB_CHUNK_OVERLAP:80}
    # 检索返回的命中分块数
    top-k: ${AGENTFLOW_KB_TOP_K:5}
    # 向量检索（可选）：OpenAI 兼容 /v1/embeddings 接口。配置后检索自动切「向量+关键词」混合排序，
    # 不配置则保持纯关键词模式。DeepSeek 无 embedding 接口，需另配（任意兼容网关或本地 Ollama）。
    # 配好后在 工作台 → 知识库 点「重建索引」为存量文档补向量；换模型时重建会自动清空旧向量。
    embed-url: ${AGENTFLOW_EMBED_URL:}
    embed-model: ${AGENTFLOW_EMBED_MODEL:}
    embed-key: ${AGENTFLOW_EMBED_KEY:}
  alarm:
    # 告警自动值守：监控平台 webhook 打到 POST /api/hooks/alarm，自动排查并推送结论
    enabled: ${AGENTFLOW_ALARM_ENABLED:true}
    # 共享令牌：这是个能触发真实排查与推送的端点，暴露到内网以外时务必配置
    # （请求头 X-AgentFlow-Token，或 URL 上的 ?token=）。留空则不校验。
    token: ${AGENTFLOW_ALARM_TOKEN:}
    # 单次排查的超时（毫秒），超时按当前进度收尾并推送
    timeout-ms: ${AGENTFLOW_ALARM_TIMEOUT_MS:180000}
    # 去重窗口（秒）：同一告警（同名+同服务+同链路+同状态）在此窗口内只排查一次，防告警风暴
    dedup-seconds: ${AGENTFLOW_ALARM_DEDUP_SECONDS:600}
    # 同时进行的排查数上限（超出进队列，队列满则拒绝并落库）
    max-concurrent: ${AGENTFLOW_ALARM_MAX_CONCURRENT:2}
    # 排查记录保留条数上限
    max-records: ${AGENTFLOW_ALARM_MAX_RECORDS:1000}
    # 自定义排查指令模板，可用占位符 {traceId} {service} {alertName} {severity} {message} {title}；
    # 留空则按「有链路→有服务→都没有」自动选择内置指令
    command: ${AGENTFLOW_ALARM_COMMAND:}
  wecom:
    # 企微接入（内置 wecom.* 工具）：经由部署机上的 wecom-cli 调用（npm install -g @wecom/cli，Node 18+），
    # 扫码授权在终端执行 wecom-cli auth init，服务端不接触任何 Secret
    enabled: ${AGENTFLOW_WECOM_ENABLED:true}
    cli-cmd: ${AGENTFLOW_WECOM_CLI_CMD:wecom-cli}
    # 单次 CLI 调用超时（毫秒）
    timeout-ms: ${AGENTFLOW_WECOM_TIMEOUT_MS:60000}
    # 单次 CLI 输出截断上限（字符）
    max-output-chars: ${AGENTFLOW_WECOM_MAX_OUTPUT_CHARS:60000}
    # 一键工作日报（内置 wecom.daily 工具）：目标智能表格与提交人写死在配置里，写入幂等（同日同提交人更新而非新增）
    daily:
      docid: ${AGENTFLOW_DAILY_DOCID:}
      sheet-id: ${AGENTFLOW_DAILY_SHEET_ID:}
      submitter-userid: ${AGENTFLOW_DAILY_SUBMITTER:}
      summary-field: ${AGENTFLOW_DAILY_SUMMARY_FIELD:今日工作总结}
      plan-field: ${AGENTFLOW_DAILY_PLAN_FIELD:明日工作计划}
      date-field: ${AGENTFLOW_DAILY_DATE_FIELD:日报提交日期}
      submitter-field: ${AGENTFLOW_DAILY_SUBMITTER_FIELD:提交人}
  mcpserver:
    # 对外 MCP 服务（把 Agent 工具暴露给企微智能机器人等外部 MCP 客户端，端点 POST /api/mcp/server）
    enabled: ${AGENTFLOW_MCP_SERVER_ENABLED:true}
    # Bearer 令牌；留空时只允许本机回环访问（暴露到内网以外务必配置）
    token: ${AGENTFLOW_MCP_SERVER_TOKEN:}
    # 不对外暴露的工具名前缀（逗号分隔）
    blacklist: ${AGENTFLOW_MCP_SERVER_BLACKLIST:}
    # 调用记录保留条数
    call-log-max: ${AGENTFLOW_MCP_SERVER_CALL_LOG_MAX:500}
  schedule:
    morning-report:
      # 自动晨报机器人：定时生成昨日日报并推送（需配置 GITLAB_TOKEN；推送需配置 Webhook）
      enabled: ${AGENTFLOW_MORNING_REPORT:false}
      # 工作日早上 9 点（Spring cron，本地时区）
      cron: ${AGENTFLOW_MORNING_CRON:0 0 9 * * MON-FRI}
      command: ${AGENTFLOW_MORNING_COMMAND:根据我的 GitLab 提交记录生成昨天的工作日报}

logging:
  level:
    root: info
